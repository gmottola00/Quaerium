name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,milvus,qdrant,chroma,neo4j,supabase,ollama,openai,pdf,docx,agents,agents-postgres,agents-redis,server]" httpx
    
    # Blocking on real errors (pyflakes/pycodestyle E). Whitespace (W) and
    # import order (I) are still reported by black/isort below, non-blocking.
    - name: Lint with ruff
      run: |
        ruff check src/quaerium tests --extend-ignore W,I
    
    - name: Check formatting with black
      run: |
        black --check src/quaerium tests examples scripts
      continue-on-error: true
    
    - name: Check imports with isort
      run: |
        isort --check-only src/quaerium tests examples scripts
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy src/quaerium
      continue-on-error: true
    
    - name: Test with pytest
      run: |
        pytest --cov=quaerium --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      if: success() || failure()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
      continue-on-error: true

  # The core install must work with no extras at all.
  minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install without extras
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Import core packages
      working-directory: /tmp
      run: |
        python -W error::SyntaxWarning -c "import quaerium, quaerium.rag, quaerium.core, quaerium.core.index.base, quaerium.infra.vectorstores, quaerium.infra.graphstores, quaerium.infra.storage, quaerium.infra.parsers, quaerium.infra.evaluation; print(quaerium.__version__)"
        # The agents kernel is an extra: without it the import must fail with the install hint.
        python -c "
        try:
            import quaerium.agents
        except ImportError as e:
            assert 'quaerium[agents]' in str(e), e
        else:
            raise SystemExit('quaerium.agents imported without its extra')
        "

    - name: Install the agents extras and import the kernel
      working-directory: /tmp
      run: |
        pip install "$GITHUB_WORKSPACE[agents,server]"
        python -c "import quaerium.agents, quaerium.agents.server, quaerium.agents.testing; print('agents ok')"

  build:
    runs-on: ubuntu-latest
    needs: [test, minimal]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/
